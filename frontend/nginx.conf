server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：必须 ≥ 应用层的限制（图片 10MB / 文档 20MB）。
    # nginx 默认 1MB，截图稍大就会被 413 拦在应用之前，
    # 且这个错误发生在反向代理层，应用连"提示原因"的机会都没有。
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # SPA 前端路由
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 绝不缓存：它是新版本资源的"入口"，
        # 被缓存就会继续引用旧 JS，新功能对用户永远不生效。
        # 带 hash 的静态资源由下面的规则长缓存，互不冲突。
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带内容哈希的静态资源：内容一变文件名就变，可以放心长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出的关键配置：
        # nginx 默认会缓冲后端响应，不关闭的话流式会退化成一次性返回
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
