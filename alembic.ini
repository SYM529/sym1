# Alembic 配置
# 数据库 URL 不在 ini 里写死，由 alembic/env.py 从 DATABASE_URL 读取
# （默认 sqlite:///./agent.db），避免把连接串提交进仓库。

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 迁移文件名格式：0001_xxx.py，便于按序号阅读
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
