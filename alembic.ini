# Alembic config.
# NOTE: keep this file ASCII-only -- configparser on Windows reads it with the
# locale encoding (GBK), and non-ASCII comments would break `alembic` commands.
# The database URL is NOT hardcoded here; alembic/env.py reads DATABASE_URL
# (fallback sqlite:///./agent.db) so credentials stay out of the repo.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration file name: 0001_xxx.py, easy to read in order
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
